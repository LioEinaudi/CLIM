name: Offline regression
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test dependency
        run: python -m pip install -e '.[dev]'
      - name: Record environment and collected tests
        run: |
          mkdir -p test-results
          git rev-parse HEAD > test-results/commit.txt
          python -VV > test-results/python.txt
          python -m pip freeze > test-results/packages.txt
          set -o pipefail
          python -m pytest --collect-only -q 2>&1 | tee test-results/collection.txt
      - name: Run all offline suites
        run: python scripts/run_repo_tests.py --out test-results/pytest.xml
      - name: Save results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-python-${{ matrix.python-version }}
          path: test-results/
